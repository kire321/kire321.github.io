name: Publish Thai RPG (app at /, CMS data at /cms, CMS UI at /cms-ui) to GitHub Pages
# Legacy branch-based Pages (source: master /) redeploys automatically on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
permissions:
  contents: write
concurrency:
  group: pages-publish
  cancel-in-progress: false
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: kire321/thai-rpg
          ref: master
          path: app-src
      - uses: actions/checkout@v4
        with:
          repository: kire321/thai-rpg-content
          ref: master
          path: cms-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app-src/package-lock.json
            cms-src/package-lock.json
      - run: npm ci
        working-directory: app-src
      - run: npm run build
        working-directory: app-src
      - run: npm ci
        working-directory: cms-src
      - run: npm run build
        working-directory: cms-src
      - name: Assemble site
        working-directory: site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -r ../app-src/dist/. .
          mkdir -p cms cms-ui
          cp -r ../cms-src/public/. cms/
          cp -r ../cms-src/dist/. cms-ui/
          # strip data duplicated into the UI build by vite's public/ copy; the UI fetches from /cms/
          rm -rf cms-ui/episodes.json cms-ui/vocab_items.json cms-ui/characters.json cms-ui/places.json cms-ui/subplots.json cms-ui/tags.json cms-ui/characters cms-ui/places
          touch .nojekyll
      - name: Commit and push
        working-directory: site
        run: |
          git config user.email "deploy-bot@kire321.github.io"
          git config user.name "thai-rpg-deploy"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "publish: thai-rpg@$(git -C ../app-src rev-parse --short HEAD) cms@$(git -C ../cms-src rev-parse --short HEAD)"
            git push
          fi
