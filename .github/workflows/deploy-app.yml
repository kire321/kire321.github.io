name: Publish Thai RPG (app + CMS mirror) to GitHub Pages
# Legacy branch-based Pages (source: master /) redeploys automatically on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
permissions:
  contents: write
concurrency:
  group: pages-publish
  cancel-in-progress: false
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: kire321/thai-rpg
          ref: master
          path: app-src
      - uses: actions/checkout@v4
        with:
          repository: kire321/thai-rpg-content
          ref: main
          path: cms-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-src/package-lock.json
      - run: npm ci
        working-directory: app-src
      - run: npm run build
        working-directory: app-src
      - name: Assemble site (app at /, CMS mirror at /thai-rpg-content/)
        working-directory: site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -r ../app-src/dist/. .
          mkdir -p thai-rpg-content
          cp -r ../cms-src/public/. thai-rpg-content/
          touch .nojekyll
      - name: Commit and push
        working-directory: site
        run: |
          git config user.email "deploy-bot@kire321.github.io"
          git config user.name "thai-rpg-deploy"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "publish: thai-rpg@$(git -C ../app-src rev-parse --short HEAD) cms@$(git -C ../cms-src rev-parse --short HEAD)"
            git push
          fi
